<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assignment 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Assignment 1</h1>

    <p>
      This is a paragraph. You can write anything you want here.
    </p>

    <h2>A Link</h2>
    <p>
      To learn more about HTML click this link
      <a href="https://www.w3schools.com">Visit W3Schools.com!</a>
    </p>

    <h2>An Image</h2>
    <img src="mountain.svg" alt="Mountains" width="400" height="250" />

    <h2>A Table</h2>
    <table style="width:70%; text-align:left;">
      <tr>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Jill</td>
        <td>Smith</td>
        <td>50</td>
      </tr>
      <tr>
        <td>Eve</td>
        <td>Jackson</td>
        <td>94</td>
      </tr>
    </table>

    <h2>List</h2>

    <h3>Unordered list</h3>
    <ul>
      <li>Coffee</li>
      <li>Tea</li>
      <li>Milk</li>
    </ul>


  </body>
</html>
